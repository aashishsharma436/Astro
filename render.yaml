services:
  - type: web
    name: astro-consultancy-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: FRONTEND_ORIGIN
        sync: false
      - key: CONSULTANT_EMAIL
        value: iaastrophilee@gmail.com
      - key: INFISICAL_SITE_URL
        value: https://app.infisical.com
      - key: INFISICAL_CLIENT_ID
        sync: false
      - key: INFISICAL_CLIENT_SECRET
        sync: false
      - key: INFISICAL_PROJECT_ID
        sync: false
      - key: INFISICAL_ENVIRONMENT
        value: prod
      - key: INFISICAL_SECRET_PATH
        value: /
      - key: MAIL_FROM
        value: iaastrophilee@gmail.com
